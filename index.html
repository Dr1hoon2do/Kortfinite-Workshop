<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kortfinite 카드 공방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
/* Layout: 장부 형태. 왼쪽 목록, 오른쪽 편집기 (폰에서는 편집기가 화면을 덮는다). 비용 색은 게임 자원색 그대로 */
:root{
  --bg:#e9ecef; --surface:#fbfcfd; --sunk:#dfe3e8; --line:#c9cfd6;
  --ink:#1b2129; --muted:#5d6773; --accent:#2e5d8a; --accent-ink:#ffffff;
  --energy:#c98a12; --mana:#2f6fd0; --hp:#c63d3d; --gold:#a57a10;
  --v-red:#c63d3d; --v-blue:#2f6fd0; --v-yellow:#c3a114; --v-green:#2f8f57; --v-purple:#7a4fc0; --v-default:#5d6773;
  --t-slate:#5d6773; --t-red:#c63d3d; --t-amber:#c98a12; --t-green:#2f8f57; --t-teal:#13817a; --t-blue:#2f6fd0; --t-violet:#7a4fc0; --t-pink:#c2457f; --t-orange:#d0641c; --t-lime:#6b9a1c; --t-sky:#1f8fc4; --t-indigo:#4f5bd0; --t-brown:#8a5a3a; --t-rose:#d0405a; --t-olive:#8a8a2a; --t-gray:#8a8f96;
  --warn:#b4401b;
  --f-body:"IBM Plex Sans KR",system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14181d; --surface:#1c2128; --sunk:#252b33; --line:#343c46;
  --ink:#e4e8ec; --muted:#97a1ac; --accent:#7fb0e0; --accent-ink:#0f1720;
  --energy:#e8ad3a; --mana:#6aa1f0; --hp:#ec6b6b; --gold:#d8b14a;
  --v-red:#ec6b6b; --v-blue:#6aa1f0; --v-yellow:#e2c54a; --v-green:#5cc48a; --v-purple:#a989e6; --v-default:#97a1ac;
  --t-slate:#97a1ac; --t-red:#ec6b6b; --t-amber:#e8ad3a; --t-green:#5cc48a; --t-teal:#4cc2b8; --t-blue:#6aa1f0; --t-violet:#a989e6; --t-pink:#e87bb0; --t-orange:#f09255; --t-lime:#a3cf4f; --t-sky:#5cbcec; --t-indigo:#8a93f0; --t-brown:#c49066; --t-rose:#f27a90; --t-olive:#c5c45a; --t-gray:#b9bec5;
  --warn:#f08a5d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181d; --surface:#1c2128; --sunk:#252b33; --line:#343c46;
  --ink:#e4e8ec; --muted:#97a1ac; --accent:#7fb0e0; --accent-ink:#0f1720;
  --energy:#e8ad3a; --mana:#6aa1f0; --hp:#ec6b6b; --gold:#d8b14a;
  --v-red:#ec6b6b; --v-blue:#6aa1f0; --v-yellow:#e2c54a; --v-green:#5cc48a; --v-purple:#a989e6; --v-default:#97a1ac;
  --t-slate:#97a1ac; --t-red:#ec6b6b; --t-amber:#e8ad3a; --t-green:#5cc48a; --t-teal:#4cc2b8; --t-blue:#6aa1f0; --t-violet:#a989e6; --t-pink:#e87bb0; --t-orange:#f09255; --t-lime:#a3cf4f; --t-sky:#5cbcec; --t-indigo:#8a93f0; --t-brown:#c49066; --t-rose:#f27a90; --t-olive:#c5c45a; --t-gray:#b9bec5;
  --warn:#f08a5d; color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.82em}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em}
.top h1 small{font-weight:500;color:var(--muted);font-size:12px;margin-left:6px}
#status{font-size:12px;color:var(--muted);margin-right:auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 11px;font-size:13px;font-weight:500}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--hp)}
.btn.armed{background:var(--hp);border-color:var(--hp);color:#fff}
.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto}
.tab{border:0;background:none;padding:8px 12px 9px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:11px;margin-left:4px;color:var(--muted)}

main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){main{grid-template-columns:minmax(300px,380px) minmax(0,1fr)}}
.pane{overflow-y:auto;min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
#list{border-right:1px solid var(--line)}
#editor{background:var(--surface)}
@media (max-width:899px){
  #editor{position:fixed;inset:0;z-index:20;padding-top:calc(14px + env(safe-area-inset-top,0px))}
  #editor[hidden]{display:none!important}
}
@media (min-width:900px){#editor[hidden]{display:block!important}}

.listbar{display:flex;gap:8px;margin-bottom:10px}
.listbar input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px}
.qhint[hidden]{display:none}
.qhint{font-size:11px;color:var(--muted);margin:-4px 0 10px;line-height:1.6}
.qhint code{font-family:var(--f-mono);font-size:11px;background:var(--sunk);padding:0 4px;border-radius:3px;cursor:pointer}
.adder.col{flex-direction:column;align-items:stretch}
.sugg{display:flex;flex-wrap:wrap;gap:5px;max-height:88px;overflow-y:auto;border:1px solid var(--line);border-radius:6px;padding:5px;background:var(--surface);overscroll-behavior:contain}
.sugg .chip{cursor:pointer;background:var(--surface)}
.sugg[hidden],.recs[hidden]{display:none}
.lintf{display:flex;flex-wrap:wrap;gap:5px}
.lintf .chip{cursor:pointer}
.lintf .chip[aria-pressed="false"]{opacity:.45}
.sugg .new{color:var(--muted);border-style:dashed}
.recs{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:6px;font-size:12px;color:var(--muted)}
.recs .chip{cursor:pointer;border-style:dashed}
.lint{display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow:auto}
.lint .use{font-size:13px}
.lint .k{font-size:11px;color:var(--warn);font-family:var(--f-mono)}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px}
.row:hover{border-color:var(--accent)}
.row.sel{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.row .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .id{color:var(--muted)}
.row .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:24px 4px;line-height:1.6}

.pip{display:inline-flex;align-items:center;gap:3px;font-family:var(--f-mono);font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;color:#fff}
.pip.energy{background:var(--energy)}.pip.mana{background:var(--mana)}.pip.hp{background:var(--hp)}.pip.gold{background:var(--gold)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:1px 8px;border-radius:999px;border:1px solid currentColor;background:none;line-height:1.6}
.chip button{border:0;background:none;padding:0 0 0 2px;font-size:13px;line-height:1;color:inherit;opacity:.7}
.chip.off{opacity:.45}
.chip.missing{color:var(--warn);border-style:dashed}
.chip.link{cursor:pointer}
.chip.memo{color:var(--muted);border-style:dotted}
.chip.memo small{font-size:10px;opacity:.7}
.chip.fold,.chip.fold-on{color:var(--accent)}
.chip.fold{border-color:transparent;padding:0 2px}
.chip.self{border-style:double;font-weight:600}
.chip.self small{font-weight:400;opacity:.7}
.chip .mlink{border:0;background:none;padding:0;font:inherit;color:inherit;opacity:1}
.recs .lab2{font-weight:600;color:var(--muted)}
.theme-grid{display:flex;flex-direction:column;gap:12px}

.ed-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ed-head h2{margin:0;font-size:20px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{display:inline-flex}
@media (min-width:900px){.back{display:none}}
.ed-empty{color:var(--muted);padding:40px 0;max-width:46ch;line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px 14px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide{grid-column:1/-1}
.f>label,.lab{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.f input,.f select,.f textarea,.inp{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 9px;min-width:0;width:100%}
.f textarea{min-height:64px;resize:vertical}
.f input.bad{border-color:var(--warn)}
.hint{font-size:12px;color:var(--muted)}
.hint.warn{color:var(--warn)}
.costs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.cost{display:flex;flex-direction:column;gap:2px}
.cost span{font-size:11px;font-weight:600}
.cost.energy span{color:var(--energy)}.cost.mana span{color:var(--mana)}.cost.hp span{color:var(--hp)}.cost.gold span{color:var(--gold)}
.cost input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 8px;font-family:var(--f-mono);width:100%;min-width:0}
.refs{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.adder{display:flex;gap:6px;margin-top:6px}
.adder input{flex:1;min-width:0;border:1px dashed var(--line);background:none;border-radius:6px;padding:5px 9px;font-size:13px}

section.blk{border-top:1px solid var(--line);margin-top:20px;padding-top:16px}
section.blk>h3{margin:0 0 10px;font-size:13px;font-weight:700;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
section.blk>h3 .sp{flex:1}

.tree{overflow-x:auto;padding:4px 0 8px}
.tree ul{list-style:none;margin:0;padding-left:22px;position:relative}
.tree>ul{padding-left:0}
.tree li{position:relative;padding:4px 0}
.tree ul ul li::before{content:"";position:absolute;left:-14px;top:0;bottom:50%;width:12px;border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);border-bottom-left-radius:6px}
.tree ul ul li:not(:last-child)::after{content:"";position:absolute;left:-14px;top:50%;bottom:0;border-left:1.5px solid var(--line)}
.node{display:inline-flex;flex-direction:column;gap:1px;border:1.5px solid var(--vc);border-radius:7px;padding:4px 10px;background:var(--surface);white-space:nowrap;text-align:left}
.node b{font-size:13px;color:var(--vc)}
.node small{font-size:11px;color:var(--muted)}

.up{border:1px solid var(--line);border-left:4px solid var(--vc);border-radius:8px;margin-top:10px;background:var(--bg)}
.up>summary{list-style:none;cursor:pointer;padding:9px 12px;display:flex;align-items:center;gap:8px;font-weight:600}
.up>summary::-webkit-details-marker{display:none}
.up>summary .k{font-family:var(--f-mono);font-size:11px;color:var(--vc)}
.up>summary .sp{flex:1}
.up .body{padding:4px 12px 14px}
.up .f input,.up .f select,.up .f textarea,.up .cost input{background:var(--surface)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 64px 28px;gap:6px;align-items:center;margin-top:5px}
.mrow.drop{grid-template-columns:minmax(0,1fr) 56px 64px 28px}
.mrow .mn{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .mn.missing{color:var(--warn)}
.mrow input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 7px;font-family:var(--f-mono);width:100%;min-width:0}
.x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:4px}
.uses{display:flex;flex-direction:column;gap:5px}
.use{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--bg);text-align:left;width:100%}
.use .sp{flex:1;min-width:0}
.use .c{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;background:var(--c)}
.sw[aria-pressed="true"]{border-color:var(--ink)}

.sheet{position:fixed;inset:0;z-index:40;background:rgba(10,14,20,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .card{background:var(--surface);border-radius:12px 12px 0 0;width:min(560px,100%);padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;max-height:90%;overflow:auto}
@media (min-width:600px){.sheet{align-items:center}.sheet .card{border-radius:12px}}
.sheet h3{margin:0;font-size:16px}
.sheet p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
.sheet .acts{display:flex;flex-wrap:wrap;gap:8px}
.sheet textarea{width:100%;min-height:140px;font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:8px}
@media (prefers-reduced-motion:no-preference){.row,.btn,.chip{transition:background-color .12s,border-color .12s}}
.who{font-size:12px;color:var(--muted);max-width:14em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gate{max-width:44ch;display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding:28px 4px;color:var(--muted);line-height:1.7}
.login{display:flex;flex-direction:column;gap:8px;width:100%;max-width:320px}
.login input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 10px;width:100%}
.gate code{font-family:var(--f-mono);font-size:12px;background:var(--sunk);padding:1px 5px;border-radius:4px;color:var(--ink);word-break:break-all}
</style>
</head>
<body>

<header>
  <div class="top">
    <h1>카드 공방<small>Kortfinite</small></h1>
    <span id="status">불러오는 중…</span>
    <button class="btn" id="btnLint" type="button">점검</button>
    <span class="who" id="who"></span>
    <button class="btn" id="btnAuth" type="button">로그인</button>
    <button class="btn" id="btnImport" type="button">가져오기</button>
    <button class="btn primary" id="btnExport" type="button">내보내기</button>
    <input type="file" id="fileIn" accept=".zip,.json,.txt,application/zip,application/json,text/plain,application/octet-stream" hidden>
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</header>
<main>
  <div class="pane" id="list"></div>
  <div class="pane" id="editor" hidden></div>
</main>
<div id="sheetHost"></div>

<script>
"use strict";
const COLS = {cards:"카드", materials:"재료", enemies:"적", tags:"태그", folders:"폴더"};
const PREFIX = {cards:"card", materials:"mat", enemies:"enemy", tags:"tag", folders:"folder"};
const ITEMC = ["cards", "enemies", "materials", "tags"]; // 폴더에 담을 수 있는 것들
const COST = [["energy","기력"],["mana","마나"],["hp","체력"],["gold","골드"]];
const KINDS = [["basic","기본"],["reward","보상"],["special","특수"]];
const VARIANTS = [["red","빨강","붉은"],["blue","파랑","푸른"],["yellow","노랑","노란"],["green","초록","초록"],["purple","보라","보랏빛"]];
const TAGCOLORS = ["slate","gray","red","rose","orange","amber","olive","lime","green","teal","sky","blue","indigo","violet","pink","brown"];
const ID_RE = /^[a-z0-9_]+$/;

const S = {cards:{}, materials:{}, enemies:{}, tags:{}, folders:{}};
let tab = "cards", sel = null, q = "", tagFilter = null, draft = null, themeOpen = {};
let mode = "wait";

const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o ?? {}));
const sortIds = c => Object.keys(S[c]).sort((a,b) => (S[c][a].name||a).localeCompare(S[c][b].name||b, "ko"));
function setStatus(t){ $("#status").textContent = t; }

/* ---------- 저장 (Firebase Realtime Database) ---------- */
const FB_CONFIG = {
  apiKey: "AIzaSyB5S27pJjTTtSzXUsCLNbBQPcb_P1m7Eso",
  authDomain: "kortfinite-drhoondo.firebaseapp.com",
  databaseURL: "https://kortfinite-drhoondo-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kortfinite-drhoondo",
  storageBucket: "kortfinite-drhoondo.firebasestorage.app",
  messagingSenderId: "877620571174",
  appId: "1:877620571174:web:e4c5de11366c19012dcae7"
};
const ROOT = "workshop";
let user = null, rdb = null, auth = null, listeners = [], loaded = {};
const pending = new Map(); let qtimer = null;
const arr = v => Array.isArray(v) ? v.filter(x => x != null) : (v && typeof v === "object" ? Object.values(v) : []);
function norm(c, d){
  d = clone(d); d.memo = arr(d.memo);
  if(c === "cards"){ d.cost = d.cost || {}; d.tags = arr(d.tags); d.upgrades = arr(d.upgrades).map(u => ({...u, cost:u.cost||{}, tags:arr(u.tags), materials:arr(u.materials)})); }
  if(c === "enemies"){ d.tags = arr(d.tags); d.drops = arr(d.drops); }
  if(c === "tags"){ d.tags = arr(d.tags); }
  if(c === "folders"){ d.items = arr(d.items); d.parent = d.parent || ""; }
  return d;
}
function put(c, id, data){
  if(data === null) delete S[c][id]; else S[c][id] = data;
  if(!user){ setStatus("로그인해야 저장돼"); return; }
  pending.set(c+"/"+id, {c, id, data}); clearTimeout(qtimer); qtimer = setTimeout(flush, 400); setStatus("저장 대기…");
}
async function flush(){
  if(!pending.size) return;
  const upd = {};
  for(const [k, p] of pending) upd[k] = p.data === null ? null : clone(p.data);
  pending.clear(); setStatus("저장 중…");
  try{ await rdb.ref(ROOT).update(upd); if(!pending.size) setStatus("저장됨"); }
  catch(e){ setStatus("저장 실패: " + (e.code || e.message)); if(/permission/i.test(e.code || e.message)) showPerm(); }
}
function subscribe(){
  unsubscribe();
  for(const c in COLS){
    const ref = rdb.ref(ROOT + "/" + c);
    const fn = ref.on("value", snap => {
      const v = snap.val() || {}, next = {};
      for(const id in v) next[id] = pending.has(c+"/"+id) && S[c][id] ? S[c][id] : norm(c, v[id]);
      for(const [k, p] of pending){ if(p.c !== c) continue; if(p.data === null) delete next[p.id]; else next[p.id] = S[c][p.id]; }
      S[c] = next; loaded[c] = true;

    if(id === tid) continue;
    let shared = 0;
    for(const t of tagClosure(id)) if(t !== id && mine.has(t)) shared++;
    if(shared) bump(id, "theme", shared);
  }
  for(const c of ["cards", "enemies"]) for(const id in S[c]){
    const d = S[c][id];

    for(const g of groups) if(g.includes(tid)) for(const o of g) bump(o, "co");

}

  const ex = new Set(have || []), score = {};

}

const parentOf = fid => (S.folders[fid] || {}).parent || "";
function folderDesc(fid){                                                       // fid와 그 아래 모든 폴더
  const out = new Set([fid]);
  for(let grew = true; grew;){ grew = false; for(const f in S.folders) if(!out.has(f) && out.has(parentOf(f))){ out.add(f); grew = true; } }

}
function folderPath(fid){
  const names = [], seen = new Set();

}
const foldersOf = (c, id) => Object.keys(S.folders).filter(f => L(S.folders[f].items).some(x => x.c === c && x.id === id));

function folderOrder(){                                                         // 트리 순서 [{id, depth}]

    for(const f of Object.keys(S.folders).filter(f => (S.folders[f].parent || "") === p).sort(byName)){
      if(seen.has(f)) continue;
      seen.add(f); out.push({id:f, depth}); walk(f, depth + 1);

  for(const f of Object.keys(S.folders).sort(byName)) if(!seen.has(f)){ seen.add(f); out.push({id:f, depth:0}); walk(f, 1); } // 부모가 사라진 폴더

// 검색어: 그냥 글자는 이름·id·효과 어디든. 따옴표로 띄어쓰기 묶기.
//   tag:공격  tag:"화상"  (강화 카드의 태그도 보고, 태그에 달린 상위 태그·테마까지 본다)   -tag:이동 (빼기)

//   cost:기력 (기력 비용이 있는 카드)  cost:3 (어느 자원이든 3)  cost:>=2  cost:기력>=2  cost:없음
//     cost:기력 cost:3 처럼 자원과 숫자를 같이 쓰면 "기력 3"으로 묶어서 본다 (강화 카드의 비용도 본다)
//   memo:밸런스 (메모 태그)   folder:"테마 A" (폴더, 하위 폴더까지)
function parseQuery(text){
  const out = [];
  const re = /(-?)(\w+):"([^"]*)"|(-?)(\w+):(\S+)|"([^"]*)"|(\S+)/g;
  let m;
  while((m = re.exec(text))){
    if(m[2]) out.push({neg:!!m[1], key:m[2].toLowerCase(), val:m[3]});
    else if(m[5]) out.push({neg:!!m[4], key:m[5].toLowerCase(), val:m[6]});
    else out.push({neg:false, key:null, val:m[7] ?? m[8]});
  }
  return out;
}
function tagIdsFor(val){

function allTags(d){ return [...(d.tags||[]), ...(d.upgrades||[]).flatMap(u => u.tags||[])]; }
// 비용 검색: cost:기력  cost:3  cost:>=2  cost:기력>=2  cost:기력:3  cost:없음
const COSTKEY = {energy:"energy", "기력":"energy", mana:"mana", "마나":"mana", hp:"hp", "체력":"hp", gold:"gold", "골드":"gold", "돈":"gold"};
function parseCost(val){
  const v = String(val || "").trim().toLowerCase();
  if(["none", "free", "없음", "무료"].includes(v)) return {none:true};
  const m = v.match(/^([a-z가-힣]+)?\s*:?\s*(>=|<=|=|>|<)?\s*(\d+)?$/);
  if(!m) return null;
  const kind = m[1] ? COSTKEY[m[1]] : undefined;
  if(m[1] && !kind) return null;
  const n = m[3] !== undefined ? Number(m[3]) : undefined;
  if(!kind && n === undefined) return null;
  if(!kind && n === 0 && !m[2]) return {none:true};
  return {kind, op:m[2] || "=", n};
}
const cmp = (a, op, n) => op === ">=" ? a >= n : op === "<=" ? a <= n : op === ">" ? a > n : op === "<" ? a < n : a === n;

  if(s.kind) return s.n === undefined ? (cost[s.kind] || 0) > 0 : cmp(cost[s.kind] || 0, s.op, s.n);
  return COST.some(([k]) => (cost[k] || 0) > 0 && cmp(cost[k], s.op, s.n));
}
// 한 비용 칸이 조건들을 다 만족하나. 자원 이름과 숫자가 같이 있으면 그 자원의 숫자로 본다

  for(const s of specs){
    if(!s.none && !s.kind && s.n !== undefined && kinds.length){ if(!kinds.some(k => cmp(cost[k.kind] || 0, s.op, s.n))) return false; }
    else if(!costOk(cost, s)) return false;

}

  if(t.key === "cost"){ const s = c === "cards" ? parseCost(t.val) : null; return !!s && costList(d).some(cost => costMatch(cost, [s])); }

  if(t.key === "folder") return inFolder(c, id, t.val);
  if(t.key === "has" || t.key === "no"){

    const f = {"강화":() => (d.upgrades||[]).length > 0, "재료":() => (d.upgrades||[]).some(u => (u.materials||[]).length) || (d.drops||[]).length > 0,

// ---------- 알아서 추천 ----------
// 효과·패턴 글에 태그 이름이 나오거나, 아래 말이 나오면 그 태그를 추천한다 (있는 태그만)
const TAG_HINTS = [
  [/피해|공격|치기|찌르|베기/, ["공격", "attack"]],
  [/이동|순간이동|구르|돌진|뛰어/, ["이동", "move"]],
  [/방어도/, ["방어", "defense"]],
  [/마나/, ["마나", "mana"]],
  [/체력|흡혈/, ["체력", "health"]],
  [/드로우|뽑/, ["드로우", "draw"]],
  [/던지|던져|발사|쏘|화살/, ["원거리", "ranged"]],
  [/범위|주변|\d+칸 범위/, ["범위", "area"]],
  [/제거|정화/, ["정화", "cleanse"]]
];
// 태그의 추천 키워드: 한 줄이 한 규칙(; 도 줄바꿈). || 또는 " or " = 하나라도, && 또는 " and " = 전부. && 가 || 보다 먼저 묶인다.
//   체력 && 회복        뽑기 || 뽑는 || 뽑고 || 드로우
function kwTerm(text, term){
  term = term.trim().replace(/^["']|["']$/g, "");
  if(!term) return false;
  return term.length === 1 ? new RegExp(`(^|[^가-힣])${term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}`).test(text) : text.includes(term);
}
function kwMatch(text, rules){
  return String(rules || "").split(/\n|;/).some(rule => rule.trim() &&
    rule.split(/\s*\|\|?\s*|\s+or\s+/i).some(part => part.trim() && part.split(/\s*&&?\s*|\s+and\s+/i).every(t => kwTerm(text, t))));
}
function recTags(text, have, forEnemy = false){
  // 능력치 이름(공격력·방어력·이동속도·최대체력)은 태그가 아니라 수치라서 빼고 본다
  text = (text || "").replace(/공격력|방어력|이동속도|최대\s*체력/g, " ");
  const out = new Set();
  // 태그 이름이 글에 나오면. 한 글자 이름(독·힘)은 앞 글자가 한글이 아닐 때만 ("막힘"의 힘은 아니다)
  for(const id of Object.keys(S.tags)){
    const n = S.tags[id].name;
    if(!n) continue;
    const re = n.length === 1 ? new RegExp(`(^|[^가-힣])${n}`) : null;
    if(re ? re.test(text) : text.includes(n)) out.add(id);
  }
  for(const id of Object.keys(S.tags)) if(S.tags[id].keywords && kwMatch(text, S.tags[id].keywords)) out.add(id);
  for(const [re, names] of TAG_HINTS){
    if(!re.test(text)) continue;
    const id = Object.keys(S.tags).find(k => names.includes(S.tags[k].name) || names.includes(k));
    if(id) out.add(id);
  }
  // 적은 다 치고 움직이니까 공격·이동은 추천하지 않는다
  if(forEnemy) for(const id of [...out]) if(["공격", "이동"].includes(S.tags[id].name) || ["attack", "move"].includes(id)) out.delete(id);
  return [...out].filter(id => !(have||[]).includes(id));
}
// 이 태그 칸에 맞는 글 (카드·강화: 효과, 적: 패턴)
function recSource(path){
  if(path === "tags") return sel.c === "enemies" ? (draft.pattern || "") : (draft.effect || "");
  const m = path.match(/^upgrades\.(\d+)\.tags$/);

}
function recRow(path){

      if(open && S.tags[open]){

        h += `<div class="recs">${ms.map(id => btn("rec", id)).join("") || `<span class="hint">다 붙어 있어</span>`}${ms.length > 1 ? `<button type="button" class="btn" data-act="themeall" data-path="${path}" data-v="${esc(open)}" style="padding:2px 8px;font-size:12px">모두</button>` : ""}</div>`;
      }
    }
  }
  return `<div id="recs-${path}" class="recwrap"${h ? "" : " hidden"}>${h}</div>`;
}

// ---------- 점검 ----------
function lint(){
  const out = [];
  const add = (c, id, k, text) => out.push({c, id, k, text});
  const usedTags = new Set();
  for(const id of sortIds("cards")){
    const d = S.cards[id];
    allTags(d).forEach(t => usedTags.add(t));
    if(!(d.effect||"").trim()) add("cards", id, "효과", `${d.name||id}: 효과가 비었다`);
    if(!(d.tags||[]).length) add("cards", id, "태그", `${d.name||id}: 태그가 없다`);
    const r = recTags(d.effect, d.tags); if(r.length) add("cards", id, "추천", `${d.name||id}: 추천 태그 ${r.map(t => S.tags[t].name).join(", ")}`);
    for(const u of d.upgrades||[]){
      const nm = u.name || u.key;
      if(!(u.effect||"").trim()) add("cards", id, "효과", `${nm} (${d.name}): 효과가 비었다`);
      if(!(u.tags||[]).length) add("cards", id, "태그", `${nm} (${d.name}): 태그가 없다`);
      const ru = recTags(u.effect, u.tags); if(ru.length) add("cards", id, "추천", `${nm} (${d.name}): 추천 태그 ${ru.map(t => S.tags[t].name).join(", ")}`);
      if(!(u.materials||[]).length) add("cards", id, "재료", `${nm} (${d.name}): 강화 재료가 없다`);
      for(const m of u.materials||[]) if(!S.materials[m.id]) add("cards", id, "없음", `${nm}: 없는 재료 ${m.id}`);
      for(const t of u.tags||[]) if(!S.tags[t]) add("cards", id, "없음", `${nm}: 없는 태그 ${t}`);
    }
    for(const t of d.tags||[]) if(!S.tags[t]) add("cards", id, "없음", `${d.name||id}: 없는 태그 ${t}`);
  }
  for(const id of sortIds("enemies")){
    const d = S.enemies[id];
    (d.tags||[]).forEach(t => usedTags.add(t));
    if(!(d.drops||[]).length) add("enemies", id, "재료", `${d.name||id}: 드랍이 없다`);
    const r = recTags(d.pattern, d.tags, true); if(r.length) add("enemies", id, "추천", `${d.name||id}: 추천 태그 ${r.map(t => S.tags[t].name).join(", ")}`);
    for(const m of d.drops||[]) if(!S.materials[m.id]) add("enemies", id, "없음", `${d.name||id}: 없는 재료 ${m.id}`);
  }
  const usedClosure = expandTags([...usedTags].filter(t => S.tags[t]));
  for(const id of sortIds("tags")){
    if(!usedClosure.has(id) && !members(id).length) add("tags", id, "안 씀", `태그 ${S.tags[id].name||id}: 아무 데도 안 붙었다`);
    for(const t of attached(id)) if(!S.tags[t]) add("tags", id, "없음", `태그 ${S.tags[id].name||id}: 없는 태그 ${t}가 달려 있다`);
  }
  for(const id of sortIds("folders")){
    const d = S.folders[id];
    if(!L(d.items).length && !Object.keys(S.folders).some(f => parentOf(f) === id)) add("folders", id, "안 씀", `폴더 ${d.name||id}: 비었다`);
    for(const x of L(d.items)) if(!(S[x.c] && S[x.c][x.id])) add("folders", id, "없음", `폴더 ${d.name||id}: 없는 항목 ${x.c}/${x.id}`);
    if(d.parent && !S.folders[d.parent]) add("folders", id, "없음", `폴더 ${d.name||id}: 없는 상위 폴더 ${d.parent}`);
  }
  for(const id of sortIds("materials")) if(!matUses(id).length && !matDrops(id).length) add("materials", id, "안 씀", `재료 ${S.materials[id].name||id}: 쓰이는 곳·나오는 곳이 없다`);
  return out;
}

/* ---------- 경로 편집 ---------- */
function getPath(o, path){ return path.split(".").reduce((a,k) => a == null ? a : a[k], o); }
function setPath(o, path, v){
  const ks = path.split("."); let a = o;
  for(let i=0;i<ks.length-1;i++){ const k = ks[i]; if(a[k] == null) a[k] = /^\d+$/.test(ks[i+1]) ? [] : {}; a = a[k]; }
  const last = ks[ks.length-1];
  if(v === undefined) delete a[last]; else a[last] = v;
}
function findOrCreate(c, text){
  const t = text.trim(); if(!t) return null;
  const hit = Object.keys(S[c]).find(id => id === t || (S[c][id].name||"") === t);
  if(hit) return hit;
  const id = newId(c);
  put(c, id, c === "tags" ? {name:t, color:"slate", note:"", tags:[id]} : c === "folders" ? {name:t, note:"", parent:"", items:[]} : {name:t, source:"", note:""});
  renderTabs();
  return id;
}

/* ---------- 이름(id) 바꾸기: 참조까지 같이 ---------- */
function renameRefs(c, a, b){
  const touch = (col, id) => put(col, id, S[col][id]);
  if(c === "tags"){
    for(const id in S.cards){ const d = S.cards[id]; let ch = false;
      const f = arr => (arr||[]).map(t => { if(t === a){ ch = true; return b; } return t; });
      d.tags = f(d.tags); for(const u of d.upgrades || []) u.tags = f(u.tags); if(ch) touch("cards", id); }
    for(const id in S.tags){ const d = S.tags[id]; if(L(d.tags).includes(a)){ d.tags = d.tags.map(t => t === a ? b : t); touch("tags", id); } }
    for(const id in S.enemies){ const d = S.enemies[id]; if((d.tags||[]).includes(a)){ d.tags = d.tags.map(t => t===a ? b : t); touch("enemies", id); } }
  }
  if(ITEMC.includes(c)) for(const f in S.folders){ const d = S.folders[f]; let ch = false;
    for(const x of L(d.items)) if(x.c === c && x.id === a){ x.id = b; ch = true; }
    if(ch) touch("folders", f); }
  if(c === "folders") for(const f in S.folders) if(S.folders[f].parent === a){ S.folders[f].parent = b; touch("folders", f); }
  if(c === "materials"){
    for(const id in S.cards){ const d = S.cards[id]; let ch = false;
      for(const u of d.upgrades || []) for(const m of u.materials || []) if(m.id === a){ m.id = b; ch = true; }
      if(ch) touch("cards", id); }
    for(const id in S.enemies){ const d = S.enemies[id]; let ch = false;
      for(const m of d.drops || []) if(m.id === a){ m.id = b; ch = true; }
      if(ch) touch("enemies", id); }
  }
}
function doRename(input){
  const nu = input.value.trim(), old = sel.id, hint = $("#id-hint");
  if(nu === old){ input.classList.remove("bad"); return; }
  if(!ID_RE.test(nu)){ input.classList.add("bad"); hint.textContent = "영소문자·숫자·_ 만 쓸 수 있어"; hint.className = "hint warn"; return; }
  if(S[sel.c][nu]){ input.classList.add("bad"); hint.textContent = "이미 있는 id야"; hint.className = "hint warn"; return; }
  const c = sel.c;
  put(c, nu, clone(draft)); put(c, old, null);
  renameRefs(c, old, nu);
  sel = {c, id:nu}; draft = clone(S[c][nu]);
  renderEditor(); renderList();
}

let armTimer = null;
function arm(btn, label, fn){
  if(btn.classList.contains("armed")){ clearTimeout(armTimer); fn(); return; }

function addRef(t){
  const val = t.value; t.value = ""; if(!val.trim()) return;
  const kind = t.dataset.add;
  if(kind === "memo") return addRefId(t, val.trim().replace(/^#+/, ""));
  if(kind === "item"){
    const v = val.trim().toLowerCase();
    const hits = itemCandidates(v, draft.items);
    const exact = hits.filter(k => itemLabel(k).toLowerCase() === v || k.toLowerCase() === v);
    const k = exact[0] || (hits.length === 1 ? hits[0] : null);
    if(k) addRefId(t, k);
    else { t.value = val; showSugg(t); }
    return;
  }
  const col = kind === "member" ? "tags" : kind === "folder" ? "folders" : kind;
  const id = findOrCreate(col, val); if(!id) return;
  addRefId(t, id);
}
function addRefId(t, id){
  t.value = "";
  const kind = t.dataset.add, path = t.dataset.path;
  if(kind === "memo"){
    const m = String(id).trim().replace(/^#+/, ""); if(!m) return;
    const arr = L(draft.memo).slice(); if(!arr.includes(m)) arr.push(m);
    draft.memo = arr; commit();
  } else if(kind === "folder"){
    addToFolder(id, [{c:sel.c, id:sel.id}]); renderTabs();
  } else if(kind === "member"){
    if(!tagClosure(sel.id).has(id) && id !== sel.id) attachTag(id, sel.id);
  } else if(kind === "item"){
    const i = id.indexOf("/"); const arr = L(draft.items).slice();
    const it = {c:id.slice(0, i), id:id.slice(i + 1)};
    if(!arr.some(x => x.c === it.c && x.id === it.id)) arr.push(it);
    draft.items = arr; commit();
  } else {
    const arr = getPath(draft, path) || [];
    if(kind === "tags"){ if(!arr.includes(id) && !(sel.c === "tags" && (id === sel.id || tagClosure(id).has(sel.id)))) arr.push(id); }
    else { const row = arr.find(m => m.id === id); if(row) row.count = (+row.count || 1) + 1; else arr.push({id, count:1}); }
    setPath(draft, path, arr); commit();
  }
  const fid = t.id; renderEditor(); renderList();
  const again = document.getElementById(fid); if(again) again.focus();
}

const J = o => JSON.stringify(o, null, 2) + "\n";
function exportFiles(){
  const f = {};
  for(const id of Object.keys(S.cards).sort()){
    const c = S.cards[id], ups = c.upgrades || [];
    f[`cards/${id}/default.json`] = J({id, name:c.name||"", kind:c.kind||"reward", tags:c.tags||[], cost:c.cost||{}, effect:c.effect||"", note:c.note||"", memo:c.memo||[], upgrades:ups.map(u => u.key)});
    for(const u of ups) f[`cards/${id}/${u.key}.json`] = J({id:`${id}_${u.key}`, name:u.name||"", from:u.from||"default", tags:u.tags||[], cost:u.cost||{}, effect:u.effect||"", materials:u.materials||[], note:u.note||""});
  }
  const arr = c => Object.keys(S[c]).sort().map(id => ({id, ...S[c][id]}));
  const tagsOut = () => Object.keys(S.tags).sort().map(id => ({id, ...S.tags[id], tags:selfTags(id, S.tags[id].tags)}));
  f["materials.json"] = J(arr("materials"));
  f["enemies.json"] = J(arr("enemies"));
  f["tags.json"] = J(tagsOut());
  f["folders.json"] = J(arr("folders"));
  f["data.json"] = J({version:1, cards:arr("cards"), materials:arr("materials"), enemies:arr("enemies"), tags:tagsOut(), folders:arr("folders")});
  return f;
}

// JSON 글 읽기: 앞뒤 공백·BOM·```json 코드 울타리는 벗긴다
function parseJSON(text){
  let t = String(text || "").replace(/^\uFEFF/, "").trim();
  t = t.replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/, "").trim();
  if(!t) throw new Error("비어 있다");
  return JSON.parse(t);
}
function importText(text){ return importAny(parseJSON(text)); }
// 전체 백업 { cards, materials, enemies, tags } 중 일부만 있어도 되고, 카드 하나({ id, effect … })나 카드 배열도 된다
function importAny(o){
  if(Array.isArray(o)) o = { cards: o };
  // id가 있으면 한 항목 (카드에도 tags 배열이 있어서 목록 여부로는 못 가른다)
  if(o && typeof o === "object" && typeof o.id === "string"){
    const c = Array.isArray(o.items) ? "folders" : o.drops || o.pattern !== undefined ? "enemies" : o.effect !== undefined || o.upgrades ? "cards" : o.color ? "tags" : "materials";
    o = { [c]: [o] };
  } else if(!o || typeof o !== "object" || !Object.keys(COLS).some(c => Array.isArray(o[c])))
    throw new Error("cards·materials·enemies·tags·folders 목록이나 id가 있는 항목이 아니다");
  return importBackup(o);
}
function afterImport(n){
  renderTabs(); renderList(); if(sel){ draft = clone(S[sel.c][sel.id] || {}); renderEditor(); }
  const msg = $("#imMsg"); if(msg) msg.textContent = `${n}개 항목을 불러왔어.`;
}
$("#fileIn").addEventListener("change", async e => {
  const file = e.target.files[0]; e.target.value = ""; if(!file) return;
  const msg = $("#imMsg");
  try{
    let n;
    const head = new Uint8Array(await file.slice(0, 2).arrayBuffer());
    const isZip = /\.zip$/i.test(file.name) || (head[0] === 0x50 && head[1] === 0x4b); // "PK"
    if(isZip){
      if(!window.JSZip) throw new Error("zip 라이브러리 없음");
      const zip = await JSZip.loadAsync(file);
      const files = {};
      for(const p in zip.files) if(!zip.files[p].dir && p.endsWith(".json")) files[p.replace(/^.*?(cards\/|materials\.json|enemies\.json|tags\.json|folders\.json|data\.json)/, "$1")] = JSON.parse(await zip.files[p].async("string"));
      n = files["data.json"] ? importBackup(files["data.json"]) : importFolders(files);
    } else n = importText(await file.text()); // .json · .txt · 확장자 없는 파일도 글로 읽는다
    afterImport(n);
  }catch(err){ if(msg) msg.textContent = "못 읽었어: " + err.message; }
});
function strip(o){ const r = clone(o); delete r.id; return r; }
// 가져온 항목 다듬기: 태그는 자기 자신 포함, 폴더 항목은 {c,id}만
function fixItem(c, id, d){
  if(c === "tags") d.tags = selfTags(id, d.tags);
  if(c === "folders"){ d.items = L(d.items).filter(x => x && ITEMC.includes(x.c) && typeof x.id === "string").map(x => ({c:x.c, id:x.id})); d.parent = d.parent || ""; d.note = d.note || ""; }
  if(d.memo !== undefined) d.memo = L(d.memo).map(String);
  return d;
}
function importBackup(o){
  let n = 0;
  for(const c in COLS){ for(const it of o[c] || []){ if(it && it.id && ID_RE.test(it.id)){ put(c, it.id, fixItem(c, it.id, strip(it))); n++; } } }
  return n;
}
function importFolders(files){
  let n = 0; const cards = {};
  for(const p in files){
    const m = p.match(/^cards\/([^/]+)\/([^/]+)\.json$/); if(!m) continue;
    const [, cid, key] = m; (cards[cid] = cards[cid] || {ups:{}});
    if(key === "default") cards[cid].base = files[p]; else cards[cid].ups[key] = files[p];
  }
  for(const cid in cards){
    if(!ID_RE.test(cid)) continue;
    const b = cards[cid].base || {}, ups = cards[cid].ups;
    const order = (b.upgrades || []).filter(k => ups[k]).concat(Object.keys(ups).filter(k => !(b.upgrades||[]).includes(k)));
    put("cards", cid, {name:b.name||cid, kind:b.kind||"reward", cost:b.cost||{}, effect:b.effect||"", tags:b.tags||[], note:b.note||"", memo:b.memo||[],
      upgrades:order.map(k => { const u = ups[k]; return {key:k, name:u.name||k, from:u.from||"default", cost:u.cost||{}, effect:u.effect||"", tags:u.tags||[], materials:u.materials||[], note:u.note||""}; })});
    n++;
  }
  for(const c of ["materials","enemies","tags","folders"]) for(const it of files[c+".json"] || []) if(it && it.id && ID_RE.test(it.id)){ put(c, it.id, fixItem(c, it.id, strip(it))); n++; }
  return n;
}

/* ---------- 시작 ---------- */
const WEB = /^https?:$/.test(location.protocol);
const AUTH_MSG = {"auth/invalid-credential":"이메일이나 비밀번호가 틀렸어.","auth/wrong-password":"비밀번호가 틀렸어.","auth/user-not-found":"그 이메일 계정이 없어. 콘솔 사용자 탭에서 먼저 만들어.","auth/invalid-email":"이메일 형식이 이상해.","auth/too-many-requests":"너무 많이 틀렸어. 잠깐 있다 다시 해.","auth/network-request-failed":"인터넷 연결을 확인해.","auth/unauthorized-domain":"이 주소가 Firebase 승인된 도메인에 없어.","auth/operation-not-allowed":"콘솔에서 이 로그인 방식을 안 켰어."};
const authErr = e => AUTH_MSG[e && e.code] || ("로그인 실패: " + (e && (e.code || e.message)));
function loginGoogle(){
  const p = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(p).catch(e => {
    if(e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") return auth.signInWithRedirect(p);
    if(e.code === "auth/popup-closed-by-user" || e.code === "auth/cancelled-popup-request") return;
    const m = $("#lgMsg"); if(m) m.textContent = authErr(e);
  });
}
function loginEmail(ev){
  ev.preventDefault();
  const m = $("#lgMsg"); m.textContent = "로그인 중…";
  auth.signInWithEmailAndPassword($("#lgEmail").value.trim(), $("#lgPw").value)
    .then(() => {}).catch(e => { m.textContent = authErr(e); });
}
function init(){
  renderTabs(); renderList(); renderEditor();
  if(!window.firebase){ setStatus("Firebase를 못 불러왔어"); return; }
  firebase.initializeApp(FB_CONFIG);
  auth = firebase.auth(); rdb = firebase.database();
  if(WEB) auth.getRedirectResult().catch(e => setStatus(authErr(e)));
  $("#btnAuth").onclick = () => { if(user) auth.signOut(); else { closeEditor(); const f = $("#lgEmail"); if(f) f.focus(); } };
  auth.onAuthStateChanged(u => {
    user = u;
    $("#who").textContent = u ? (u.email || "") : "";
    $("#btnAuth").textContent = u ? "로그아웃" : "로그인";
    if(u){ mode = "wait"; setStatus("연결하는 중…"); subscribe(); }
    else { unsubscribe(); for(const c in COLS) S[c] = {}; mode = "signedout"; setStatus("로그인 필요"); closeEditor(); renderTabs(); }
    renderList();
  });
}
init();
